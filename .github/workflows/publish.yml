name: Publish to npm

# Publishes when a GitHub release is published (tag vX.Y.Z), or by hand from the
# Actions tab.
#
# Authentication is trusted publishing (OIDC): no token is stored anywhere. It is
# configured on npmjs.com -> agentspec-sdd -> Settings -> Trusted publishing, with
# this repository and the workflow filename "publish.yml".
#
# npm only lets you configure a trusted publisher once the package exists, so the
# very first version has to be published another way (see "Publicação no npm" in
# the README). The optional NPM_TOKEN secret covers that one publish; npm tries
# OIDC first and only falls back to it. Delete the secret once OIDC works: npm is
# removing direct publishes from 2FA-bypass tokens around January 2027.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC for trusted publishing, and provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14; Node 24 has both.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false   # never cache in release builds

      - name: Release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Version is not published yet
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already on npm. Bump the version first."
            exit 1
          fi

      - run: npm test

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
